<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Classic Pong 1972</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
      touch-action: none;
    }
    .hud {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .hud .p1 { color: #38bdf8; }
    .hud .p2 { color: #f43f5e; }
    .box {
      position: relative;
      width: 100%;
      max-width: 540px;
      height: 360px;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; color: #38bdf8; font-weight: 800; }
    .btn-group { display: flex; gap: 10px; }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.sec { background: #334155; color: #f8fafc; }
    .btn:hover { opacity: 0.9; }
    .ctrl-hint { font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="p1">PLAYER 1: <span id="p1Score">0</span></div>
    <div>RALLY: <span id="rally" style="color: #facc15;">0</span></div>
    <div class="p2" id="p2Label">CPU: <span id="p2Score">0</span></div>
  </div>

  <div class="box">
    <canvas id="canvas" width="540" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">PONG CLASSIC</h2>
      <p id="msg" style="color:#94a3b8; font-size:13px;">First to 7 points wins!</p>
      <div class="btn-group">
        <button class="btn" onclick="start('1p')">1 PLAYER (VS CPU)</button>
        <button class="btn sec" onclick="start('2p')">2 PLAYERS (LOCAL)</button>
      </div>
    </div>
  </div>

  <div class="ctrl-hint">P1: W/S or Touch/Mouse Left · P2: Up/Down Arrows or Touch Right</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');
    const p2Label = document.getElementById('p2Label');
    const rallyEl = document.getElementById('rally');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(f, dur = 0.06) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let mode = '1p'; // '1p' or '2p'
    let p1 = { x: 20, y: 140, width: 10, height: 70, dy: 0, score: 0 };
    let p2 = { x: 510, y: 140, width: 10, height: 70, dy: 0, score: 0 };
    let ball = { x: 270, y: 180, radius: 6, dx: 4, dy: 3 };
    let rally = 0;
    let isRunning = false;
    let keys = {};
    let animId = null;

    function resetBall(servingPlayer) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      rally = 0;
      rallyEl.textContent = '0';
      const dir = servingPlayer === 1 ? 1 : -1;
      ball.dx = dir * (4 + Math.random());
      ball.dy = (Math.random() - 0.5) * 6;
    }

    function start(selectedMode) {
      mode = selectedMode;
      p2Label.innerHTML = `${mode === '1p' ? 'CPU' : 'PLAYER 2'}: <span id="p2Score">0</span>`;
      p1.score = 0;
      p2.score = 0;
      p1.y = 140;
      p2.y = 140;
      p1ScoreEl.textContent = '0';
      document.getElementById('p2Score').textContent = '0';
      resetBall(Math.random() > 0.5 ? 1 : 2);
      overlay.classList.add('hidden');
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(update);
    }

    function update() {
      if (!isRunning) return;

      // P1 input
      if (keys['KeyW'] || keys['Keyw']) p1.y = Math.max(0, p1.y - 6);
      if (keys['KeyS'] || keys['Keys']) p1.y = Math.min(canvas.height - p1.height, p1.y + 6);

      // P2 input or CPU
      if (mode === '2p') {
        if (keys['ArrowUp']) p2.y = Math.max(0, p2.y - 6);
        if (keys['ArrowDown']) p2.y = Math.min(canvas.height - p2.height, p2.y + 6);
      } else {
        // CPU AI tracking
        const target = ball.y - p2.height / 2;
        p2.y += (target - p2.y) * 0.085;
        p2.y = Math.max(0, Math.min(canvas.height - p2.height, p2.y));
      }

      // Ball physics
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Top / bottom bounce
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.dy = -ball.dy;
        playBeep(280);
      }

      // P1 paddle hit
      if (
        ball.x - ball.radius <= p1.x + p1.width &&
        ball.x + ball.radius >= p1.x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + p1.height
      ) {
        ball.dx = Math.abs(ball.dx) * 1.05; // speed up slightly
        const impact = (ball.y - (p1.y + p1.height / 2)) / (p1.height / 2);
        ball.dy = impact * 6;
        rally++;
        rallyEl.textContent = rally;
        playBeep(440);
      }

      // P2 paddle hit
      if (
        ball.x + ball.radius >= p2.x &&
        ball.x - ball.radius <= p2.x + p2.width &&
        ball.y >= p2.y &&
        ball.y <= p2.y + p2.height
      ) {
        ball.dx = -Math.abs(ball.dx) * 1.05;
        const impact = (ball.y - (p2.y + p2.height / 2)) / (p2.height / 2);
        ball.dy = impact * 6;
        rally++;
        rallyEl.textContent = rally;
        playBeep(480);
      }

      // Score conditions
      if (ball.x < 0) {
        p2.score++;
        document.getElementById('p2Score').textContent = p2.score;
        playBeep(180, 0.2);
        if (p2.score >= 7) return gameOver(mode === '1p' ? 'CPU WINS!' : 'PLAYER 2 WINS!');
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        p1ScoreEl.textContent = p1.score;
        playBeep(640, 0.2);
        if (p1.score >= 7) return gameOver('PLAYER 1 WINS!');
        resetBall(2);
      }

      draw();
      animId = requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p1.x, p1.y, p1.width, p1.height);

      // P2 paddle
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(p2.x, p2.y, p2.width, p2.height);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameOver(text) {
      isRunning = false;
      titleEl.textContent = text;
      overlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch and mouse controls
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);
      p1.y = Math.max(0, Math.min(canvas.height - p1.height, my - p1.height / 2));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      Array.from(e.touches).forEach(t => {
        const tx = (t.clientX - rect.left) * (canvas.width / rect.width);
        const ty = (t.clientY - rect.top) * (canvas.height / rect.height);
        if (tx < canvas.width / 2) {
          p1.y = Math.max(0, Math.min(canvas.height - p1.height, ty - p1.height / 2));
        } else if (mode === '2p') {
          p2.y = Math.max(0, Math.min(canvas.height - p2.height, ty - p2.height / 2));
        }
      });
    }, { passive: false });

    draw();
  </script>
</body>
</html>
