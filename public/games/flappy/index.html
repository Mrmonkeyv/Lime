<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird Neon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
      touch-action: none;
    }
    .hud {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 15px;
    }
    .hud span { color: #facc15; font-variant-numeric: tabular-nums; }
    .box {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 500px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; color: #facc15; font-weight: 800; }
    .btn {
      background: #facc15;
      color: #713f12;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #fde047; }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>

  <div class="box">
    <canvas id="canvas" width="360" height="500"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">FLAPPY WINGS</h2>
      <p id="msg" style="color:#94a3b8; font-size: 13px;">Tap screen, click, or press Space to flap</p>
      <button class="btn" id="startBtn">PLAY</button>
    </div>
  </div>

  <div class="hint">Click or Space to Fly</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const startBtn = document.getElementById('startBtn');

    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    bestEl.textContent = best;

    // Web Audio Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(f, dur = 0.08, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let bird = { x: 60, y: 220, radius: 14, velocity: 0, gravity: 0.38, jump: -6.8 };
    let pipes = [];
    let score = 0;
    let frame = 0;
    let isRunning = false;
    let animId = null;

    const PIPE_WIDTH = 52;
    const PIPE_GAP = 125;

    function init() {
      bird.y = 220;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      frame = 0;
      scoreEl.textContent = '0';
      overlay.classList.add('hidden');
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(loop);
    }

    function flap() {
      if (!isRunning) return;
      bird.velocity = bird.jump;
      playBeep(400, 0.06, 'triangle');
    }

    function gameOver() {
      isRunning = false;
      playBeep(150, 0.25, 'sawtooth');
      titleEl.textContent = "GAME OVER";
      startBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove('hidden');
    }

    function loop() {
      if (!isRunning) return;
      frame++;

      // Bird physics
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Ground or ceiling collision
      if (bird.y + bird.radius >= canvas.height - 20 || bird.y - bird.radius <= 0) {
        return gameOver();
      }

      // Generate pipes
      if (frame % 90 === 0) {
        const minTop = 50;
        const maxTop = canvas.height - PIPE_GAP - 80;
        const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: topHeight + PIPE_GAP,
          passed: false
        });
      }

      // Update pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.6;

        // Collision detection
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + PIPE_WIDTH
        ) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
            return gameOver();
          }
        }

        // Score update
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          playBeep(580, 0.08, 'sine');
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('flappy_best', best);
          }
        }

        if (p.x + PIPE_WIDTH < 0) {
          pipes.splice(i, 1);
        }
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      // Background sky
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#334155';
      ctx.fillRect(30, 40, 2, 2);
      ctx.fillRect(150, 90, 2, 2);
      ctx.fillRect(280, 50, 2, 2);
      ctx.fillRect(80, 200, 2, 2);
      ctx.fillRect(240, 320, 2, 2);

      // Draw pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.top - 16, PIPE_WIDTH + 6, 16);

        // Bottom pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom - 20);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.bottom, PIPE_WIDTH + 6, 16);
      });

      // Ground
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 2);

      // Draw bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity * 4) * Math.PI / 180));
      ctx.rotate(angle);

      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(12, -2);
      ctx.lineTo(19, 1);
      ctx.lineTo(12, 4);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    canvas.addEventListener('mousedown', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!isRunning) init();
        else flap();
      }
    });

    startBtn.onclick = init;
    draw();
  </script>
</body>
</html>
